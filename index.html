<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">

<title>NovaChat</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath d='M20 2l4 14 14 4-14 4-4 14-4-14L2 20l14-4z' fill='%23FF6B4A'/%3E%3Ccircle cx='20' cy='20' r='5' fill='%23C6F25C'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--bg:#FFF6EA;--panel:#FFFBF5;--ink:#1D1628;--mute:#7A6F88;--own:#C6F25C;--ownink:#1D1628;--other:#E9DFFF;--acc:#FF6B4A;--lil:#B79CFF;--line:#EADFCF}
@media(prefers-color-scheme:dark){:root{--bg:#130F1B;--panel:#1B1526;--ink:#F5EEFF;--mute:#9B8FB0;--other:#2B2140;--acc:#FF7A5C;--line:#2E2440}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;overscroll-behavior:none}body{position:fixed;top:0;left:0;height:var(--vh,100%)}
body{font:16px/1.4 Manrope,system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
h1,h2,.logo b{font-family:Unbounded,Manrope,sans-serif;font-weight:700}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
[hidden]{display:none!important}
.logo{display:flex;align-items:center;gap:10px}.logo svg{width:34px;height:34px;animation:spin 14s linear infinite}.logo b{font-size:20px;letter-spacing:-.5px}
@keyframes spin{to{transform:rotate(360deg)}}
/* вход */
#auth{height:100%;display:flex;padding:14px;background:radial-gradient(520px 360px at 85% 5%,rgba(183,156,255,.35),transparent),radial-gradient(460px 340px at 5% 95%,rgba(255,107,74,.28),transparent),var(--bg);overflow:auto}
.card{width:100%;max-width:400px;background:var(--panel);border:2px solid var(--ink);border-radius:32px 8px 32px 8px;padding:20px;margin:auto;box-shadow:6px 6px 0 var(--acc);display:grid;gap:10px}.card h2{font-size:20px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:14px;padding:4px}
.tabs button{padding:9px;border-radius:11px;font-weight:600;color:var(--mute)}.tabs .on{background:var(--ink);color:var(--bg)}
.card input{width:100%;padding:11px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);outline:0}.card input:focus{border-color:var(--lil)}
.btn{background:var(--acc);color:#1D1628;font-weight:800;padding:13px;border-radius:14px;width:100%;transition:transform .15s}.btn:active{transform:scale(.97)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px;border-radius:14px;border:2px solid var(--ink);font-weight:800;background:var(--bg);transition:transform .15s}.gbtn:active{transform:scale(.97)}.gbtn svg{width:20px;height:20px}
.or{text-align:center;color:var(--mute);font-size:13px}#tg{display:flex;justify-content:center;min-height:40px}
.err{color:#D8344A;font-size:14px}.err:empty{display:none}
/* приложение */
#app{height:100%;display:grid;grid-template-columns:350px 1fr;position:relative;overflow:hidden}
#side{background:var(--panel);border-right:2px solid var(--line);display:flex;flex-direction:column;min-height:0}
.shead{padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
.search{margin:0 14px 10px;padding:11px 16px;border-radius:99px;border:2px solid var(--line);background:var(--bg);outline:0;width:calc(100% - 28px)}.search:focus{border-color:var(--lil)}
#list{overflow:auto;flex:1;padding:0 8px 12px}
.item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px;border-radius:18px 6px 18px 6px;transition:background .15s}
.item:hover,.item.on{background:var(--other)}.item div{min-width:0}.item b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item small{color:var(--mute)}
.av{width:44px;height:44px;border-radius:15px 5px 15px 5px;flex:none;display:grid;place-items:center;font:700 18px Unbounded,sans-serif;color:#1D1628;overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}
.av.sm{width:36px;height:36px;font-size:15px}
#chat{display:flex;flex-direction:column;min-height:0;background:radial-gradient(500px 320px at 95% 0,rgba(183,156,255,.22),transparent),radial-gradient(420px 300px at 0 100%,rgba(255,107,74,.15),transparent),var(--bg)}
.chead{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--panel);border-bottom:2px solid var(--line);padding-top:max(10px,env(safe-area-inset-top))}
.chead b,.chead small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chead small{color:var(--mute)}
.ib{width:40px;height:40px;border-radius:14px 5px 14px 5px;background:var(--other);font-size:18px;flex:none}
#back{display:none;font-size:26px;width:38px;height:38px;border-radius:12px}
#msgs{flex:1;overflow:auto;padding:16px 14px;display:flex;flex-direction:column;gap:6px}
.day{align-self:center;font-size:12px;color:var(--mute);background:var(--panel);padding:3px 12px;border-radius:99px;margin:8px 0}
.row{display:flex;gap:8px;align-items:flex-end}.row.me{justify-content:flex-end}
.b{max-width:min(78%,520px);padding:9px 14px 6px;word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap}
.me .b{background:var(--own);color:var(--ownink);border-radius:24px 4px 24px 4px}
.ot .b{background:var(--other);border-radius:4px 24px 4px 24px}
.b .n{font-size:12px;font-weight:800;color:var(--acc);display:block}.b time{display:block;text-align:right;font-size:11px;margin-top:1px;color:color-mix(in srgb,currentColor 60%,transparent)}
.tk{display:inline-block;letter-spacing:-2px;margin-left:5px;transition:color .3s}.tk.r{color:#D83A17;font-weight:800}
.tk.chg{animation:tkp .4s cubic-bezier(.3,1.6,.5,1)}@keyframes tkp{0%{transform:scale(.3) translateY(4px);opacity:0}100%{transform:none;opacity:1}}
.dot{width:11px;height:11px;border-radius:50%;background:var(--acc);margin-left:auto;flex:none}
#hs.on{color:#2FB37A;font-weight:700}
.row.fresh .b{animation:pop .25s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{opacity:0;transform:scale(.85) rotate(-2deg)}}
form{display:flex;gap:10px;padding:10px 14px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:var(--panel);border-top:2px solid var(--line);align-items:flex-end}
textarea{flex:1;resize:none;max-height:120px;padding:11px 16px;border-radius:22px 6px 22px 22px;border:2px solid var(--line);background:var(--bg);outline:0}textarea:focus{border-color:var(--lil)}
#send{width:46px;height:46px;border-radius:16px 5px 16px 5px;background:var(--acc);display:grid;place-items:center;flex:none}#send svg{width:22px;height:22px}
.empty{margin:auto;text-align:center;color:var(--mute);display:grid;gap:10px;justify-items:center}.empty svg{width:70px;height:70px;opacity:.9}
#chat.idle .chead,#chat.idle form{display:none}#chat:not(.idle) .empty{display:none}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:16px;max-width:90%;z-index:9;animation:pop .2s}
.setup{padding:30px;text-align:center;display:grid;gap:8px;justify-items:center;max-width:420px;margin:auto}
.av.lg{width:96px;height:96px;font-size:38px;border-radius:30px 8px 30px 8px}
.pv{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec{padding:10px 14px 4px;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.pick{display:flex;align-items:center;gap:14px}
.lnk{color:var(--acc);font-weight:800;font-size:14px;text-align:left}
.modal{position:fixed;inset:0;background:rgba(10,6,16,.6);display:flex;padding:16px;z-index:20;overflow:auto}
.splash{height:100%;display:grid;place-items:center}.splash svg{width:64px;height:64px;animation:spin 3s linear infinite}
.unw{position:relative}.unw span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mute)}.card .unw input{padding-left:30px}
.ov{position:fixed;inset:0;z-index:30;background:radial-gradient(600px 400px at 80% 0,rgba(183,156,255,.3),transparent),radial-gradient(500px 400px at 0 100%,rgba(255,107,74,.25),transparent),#130F1B;color:#F5EEFF;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
#rv{position:absolute;inset:0;width:100%;height:100%;background:#000;display:none}
.cmid{position:relative;z-index:1;display:grid;gap:8px;justify-items:center}
.ov.hasv .cmid{position:absolute;top:max(14px,env(safe-area-inset-top));left:14px;justify-items:start;text-align:left;text-shadow:0 1px 6px #000}
.ov.hasv #cav{display:none}.ov.hasv .cmid h2{font-size:16px}
#lv{position:absolute;right:14px;top:max(14px,env(safe-area-inset-top));width:96px;height:132px;object-fit:cover;border-radius:18px 6px 18px 6px;background:#000;display:none;z-index:2;border:2px solid rgba(255,255,255,.25)}
.crow{display:flex;gap:14px;justify-content:center;z-index:2}
.cbar{position:absolute;left:0;right:0;bottom:max(22px,env(safe-area-inset-bottom))}
.cb{width:66px;height:66px;border-radius:22px 6px 22px 6px;background:rgba(255,255,255,.14);color:#fff;font-size:24px;display:grid;place-items:center;align-content:center;gap:0;position:relative}
.cb small{font-size:10px;opacity:.85;line-height:1}.cb.act{background:#fff;color:#1D1628}.cb.red{background:#E5484D;color:#fff}.cb.grn{background:#2FB37A;color:#fff}
.cwarn{color:#FFC857;font-size:14px}
.b{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#mm{position:fixed;inset:0;z-index:25;background:rgba(10,6,16,.35)}
.mmc{position:absolute;display:grid;gap:8px;width:min(300px,calc(100% - 16px));animation:pop .18s ease-out}
.rbar{display:flex;gap:2px;background:var(--panel);border:2px solid var(--line);border-radius:26px;padding:5px 8px;align-items:center;justify-content:space-between}
.rbar button{font-size:24px;padding:2px 3px;border-radius:12px;transition:transform .12s}.rbar button:active{transform:scale(1.3)}
.rbar .rmore{font-size:18px;background:var(--other);width:30px;height:30px;border-radius:50%;color:var(--mute)}
.rgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:6px}
.rgrid button{font-size:22px;padding:4px 0;border-radius:10px}
.mlist{background:var(--panel);border:2px solid var(--line);border-radius:20px 6px 20px 6px;overflow:hidden}
.mlist button{display:flex;gap:14px;align-items:center;width:100%;padding:13px 16px;text-align:left;font-weight:600}.mlist button:active{background:var(--other)}.mlist .dng{color:#E5484D}
.rx{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.rc{padding:2px 8px;border-radius:12px;background:rgba(0,0,0,.14);font-size:13px}.rc.me{background:var(--acc);color:#1D1628}
.rq{border-left:3px solid var(--acc);padding:2px 8px;margin-bottom:4px;border-radius:4px;background:rgba(0,0,0,.1);font-size:13px;cursor:pointer;display:grid}
.rq b{color:var(--acc);font-size:12px}.rq span{opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fw{font-size:12px;opacity:.75;font-style:italic;margin-bottom:2px}
.row.flash .b{outline:2px solid var(--acc);outline-offset:2px}
.callb{display:flex;gap:12px;align-items:center;min-width:230px}.callb b{display:block}.callb small{opacity:.75}
.ci{font-size:20px;font-weight:800;color:#2FB37A}.ci.bad{color:#E5484D}
#ctx,#pinb{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-top:2px solid var(--line);font-size:14px}
#pinb{border-top:0;border-bottom:2px solid var(--line);cursor:pointer}#pint{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ctx>div{flex:1;min-width:0;display:grid}#ctxn{color:var(--acc);font-size:12px;font-weight:800}#ctxx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ctx button,#pinb button{font-size:16px;padding:4px 8px;color:var(--mute)}
#chat.idle #ctx,#chat.idle #pinb{display:none}
.nbn{margin:6px 8px;padding:10px 12px;border-radius:14px 5px 14px 5px;background:var(--other);font-weight:700;font-size:14px;text-align:left;width:calc(100% - 16px)}
.rbtn,.rb{width:46px;height:46px;border-radius:16px 5px 16px 5px;font-size:20px;flex:none;background:var(--other)}
#mf:not(.has) #send{display:none}#mf.has .rbtn{display:none}
#rbar{display:none;flex:1;align-items:center;gap:10px;min-width:0}
#mf.rec #rbar{display:flex}#mf.rec textarea,#mf.rec .rbtn,#mf.rec #send{display:none!important}
.rb.ok{background:var(--acc)}.rdot{width:10px;height:10px;border-radius:50%;background:#E5484D;flex:none;animation:blink 1s infinite}@keyframes blink{50%{opacity:.2}}
#rtm{min-width:42px}#rlv{flex:1;min-width:0;height:28px}
.vm{display:flex;align-items:center;gap:10px;min-width:230px}
.vp{width:40px;height:40px;border-radius:50%;background:var(--acc);color:#1D1628;font-size:16px;flex:none}
.vw{display:flex;align-items:center;gap:2px;height:30px;flex:1;cursor:pointer}.vw i{flex:1;min-width:2px;border-radius:2px;background:currentColor;opacity:.35}.vw i.on{opacity:1;background:var(--acc)}
.vt{font-size:12px;min-width:34px;text-align:right}.vs{display:none;font-size:11px;font-weight:800;padding:2px 6px;border-radius:10px;background:rgba(0,0,0,.15)}.vm.pl .vs{display:block}
.b.circb{background:none!important;padding:0;position:relative}
.circ{--cs:min(62vw,230px);--p:0;width:var(--cs);height:var(--cs);border-radius:50%;padding:4px;position:relative;cursor:pointer;background:conic-gradient(var(--acc) calc(var(--p)*1%),rgba(128,128,128,.28) 0)}
.cin{position:absolute;inset:4px;border-radius:50%;overflow:hidden;background:var(--other);display:grid;place-items:center}
.cin img,.cin video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cp{position:relative;z-index:1;width:54px;height:54px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;display:grid;place-items:center;font-size:22px}.circ.pl .cp{display:none}
.cd{position:absolute;left:14px;bottom:14px;z-index:2;background:rgba(0,0,0,.5);color:#fff;border-radius:10px;padding:1px 7px;font-size:12px}
.circb time{position:absolute;right:14px;bottom:14px;z-index:2;background:rgba(0,0,0,.5);color:#fff!important;border-radius:10px;padding:1px 7px;margin:0}
#cm{z-index:28}.ccw{padding:6px;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1%),rgba(255,255,255,.18) 0)}
#ccv{display:block;width:min(74vw,300px);height:min(74vw,300px);border-radius:50%;background:#000}#ctm{font-size:22px}
@media(max-width:780px){
 #app{grid-template-columns:1fr}
 #side,#chat{position:absolute;inset:0;transition:transform .3s cubic-bezier(.3,.9,.3,1)}
 #chat{transform:translateX(100%)}#app.open #chat{transform:none}#app.open #side{transform:translateX(-25%)}
 #back{display:block}
}
</style>
</head>

<section id="auth" hidden>
  <div class="card">

<div id="app" hidden>
  <aside id="side">

      <button id="meb" title="Профиль и настройки" aria-label="Профиль и настройки"></button>

    <div class="chead">
      <button id="back" aria-label="Назад">←</button>
      <div class="av sm" id="hav"></div>
      <div style="flex:1;min-width:0"><b id="ht"></b><small id="hs"></small></div><button id="cp" class="ib" aria-label="Позвонить" title="Позвонить" hidden>📞</button><button id="cv" class="ib" aria-label="Видеозвонок" title="Видеозвонок" hidden>🎥</button>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signInWithCustomToken,signOut,GoogleAuthProvider,signInWithPopup,signInWithRedirect,setPersistence,browserLocalPersistence} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,getDocs,setDoc,onSnapshot,query,orderBy,limit,limitToLast,where,serverTimestamp,writeBatch,updateDoc,deleteDoc,deleteField,arrayUnion,arrayRemove} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getMessaging,getToken,isSupported} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";

if("serviceWorker" in navigator){
  const had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).catch(()=>{});
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(had)location.reload()}); // новая версия → сама перезагрузит
}
const $=id=>document.getElementById(id);
/* клавиатура: приложение всегда равно видимой части экрана, шапка на месте, сообщения над клавиатурой */
const vv=window.visualViewport;
function fit(){
  const box=$("msgs"),near=box.scrollHeight-box.scrollTop-box.clientHeight<200;
  const h=Math.min(vv?vv.height:Infinity,innerHeight,document.documentElement.clientHeight||Infinity);
  document.documentElement.style.setProperty("--vh",h+"px");
  document.body.style.transform=vv&&vv.offsetTop?`translateY(${vv.offsetTop}px)`:"";

if(vv){vv.addEventListener("resize",fit);vv.addEventListener("scroll",fit)}

addEventListener("focusout",()=>setTimeout(fit,200));
const COLORS=["#FF6B4A","#C6F25C","#B79CFF","#FFC857","#7DE2C3","#FF8FB1"];
const colorOf=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return COLORS[h%COLORS.length]};
const UN_RE=/^[a-z0-9_]{3,20}$/,UN_MSG="Username: 3–20 символов, только латиница, цифры и _.";
const ERR={
 "auth/invalid-email":"Некорректный адрес почты.","auth/missing-password":"Введите пароль.",
 "auth/weak-password":"Пароль слишком короткий — нужно минимум 6 символов.",
 "auth/email-already-in-use":"Эта почта уже зарегистрирована. Попробуйте войти.",
 "auth/invalid-credential":"Неверная почта или пароль.","auth/user-not-found":"Пользователь не найден.",
 "auth/wrong-password":"Неверный пароль.","auth/too-many-requests":"Слишком много попыток. Подождите немного.",
 "auth/network-request-failed":"Нет связи с интернетом.","auth/operation-not-allowed":"Этот способ входа не включён в Firebase (Authentication → Sign-in method).",
 "auth/unauthorized-domain":"Домен сайта не добавлен в Authorized domains в Firebase.",
 "auth/popup-closed-by-user":"Окно входа закрыто.","auth/popup-blocked":"Браузер заблокировал окно входа. Разрешите всплывающие окна.",
 "permission-denied":"Нет доступа. Проверьте правила Firestore.","unavailable":"Сервер недоступен. Проверьте интернет."
};
const errText=e=>ERR[e.code&&e.code.replace("firestore/","")]||ERR[e.code]||e.userMessage||"Что-то пошло не так. Попробуйте ещё раз.";
function toast(t){const d=document.createElement("div");d.id="toast";d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),3500)}

if(!CFG.firebase.apiKey||!CFG.firebase.projectId){
  document.body.innerHTML="";const s=document.createElement("div");s.className="setup";
  const h=document.createElement("h2");h.textContent="NovaChat ещё не настроен";
  const p=document.createElement("p");p.textContent="Откройте index.html и впишите ключи Firebase в блок CFG вверху файла.";
  s.append(h,p);document.body.append(s);throw new Error("CFG пуст");
}
const app=initializeApp(CFG.firebase),auth=getAuth(app),db=getFirestore(app);
setPersistence(auth,browserLocalPersistence).catch(()=>{}); // аккаунт остаётся на устройстве

/* ---------- состояние ---------- */
const cache=new Map(),loading=new Set();
let me=null,meDoc=null,cur=null,peer=null,chats=[],found=null,lastDocs=[],unsubs=[],unsubMsgs=null,unsubPeer=null,presOn=false,hb=null;
let mode="in",regPhoto="",pending=null,tgProfile=null,pPhoto="",draft={};
const GLOBAL={uid:"global",name:"Общий чат",color:"#B79CFF"};

function avatar(u,cls=""){
  const d=document.createElement("div");d.className="av "+cls;d.style.background=u.color||colorOf(u.uid||"x");
  const letter=()=>{d.textContent=(u.name||"?").trim().charAt(0).toUpperCase()||"?"};
  if(u.photo){const i=new Image();i.src=u.photo;i.referrerPolicy="no-referrer";i.alt="";i.onerror=()=>{i.remove();letter()};d.append(i)}else letter();
  return d;
}
async function loadUsers(uids){
  const need=[...new Set(uids)].filter(u=>u&&!cache.has(u)&&!loading.has(u));if(!need.length)return;
  need.forEach(u=>loading.add(u));
  await Promise.all(need.map(async u=>{
    try{const s=await getDoc(doc(db,"users",u));cache.set(u,s.exists()?{uid:u,...s.data()}:{uid:u,name:"Пользователь"})}
    catch{cache.set(u,{uid:u,name:"Пользователь"})}
    loading.delete(u);
  }));
  redraw();
}
function redraw(){drawList();if(cur)refreshHead();if(lastDocs.length)renderMsgs(lastDocs,false)}

/* ---------- фото ---------- */
const fi=$("fi");let onPick=null;
function toAvatar(file){return new Promise((res,rej)=>{
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{const s=Math.min(img.width,img.height),c=document.createElement("canvas");c.width=c.height=160;
    c.getContext("2d").drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,160,160);URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",.82))};
  img.onerror=()=>rej({userMessage:"Не удалось открыть картинку."});img.src=url;
})}
fi.onchange=async()=>{const f=fi.files[0];fi.value="";if(!f||!onPick)return;try{onPick(await toAvatar(f))}catch(x){toast(errText(x))}};
const pickPhoto=cb=>{onPick=cb;fi.click()};

/* ---------- вход / регистрация ---------- */
function setMode(m){mode=m;$("tIn").classList.toggle("on",m==="in");$("tUp").classList.toggle("on",m==="up");
  $("nm").hidden=$("unw").hidden=$("rp").hidden=m==="in";$("ab").textContent=m==="in"?"Войти":"Создать аккаунт";$("ae").textContent="";
  $("pw").autocomplete=m==="in"?"current-password":"new-password";drawReg()}
const drawReg=()=>$("rav").replaceChildren(avatar({name:$("nm").value||"?",photo:regPhoto,color:colorOf("reg")},"sm"));
$("tIn").onclick=()=>setMode("in");$("tUp").onclick=()=>setMode("up");
$("rpb").onclick=()=>pickPhoto(p=>{regPhoto=p;drawReg()});$("nm").oninput=drawReg;
$("af").onsubmit=async e=>{
  e.preventDefault();$("ae").textContent="";$("ab").disabled=true;
  try{
    const em=$("em").value.trim(),pw=$("pw").value;
    if(mode==="up"){
      const name=$("nm").value.trim(),un=$("un").value.trim().toLowerCase().replace(/^@/,"");
      if(!name)throw{userMessage:"Введите имя."};if(!UN_RE.test(un))throw{userMessage:UN_MSG};
      pending={name,username:un,photo:regPhoto};await createUserWithEmailAndPassword(auth,em,pw);
    }else await signInWithEmailAndPassword(auth,em,pw);
  }catch(x){pending=null;$("ae").textContent=errText(x)}
  $("ab").disabled=false;
};
$("gb").onclick=async()=>{
  $("ae").textContent="";const pr=new GoogleAuthProvider();pr.setCustomParameters({prompt:"select_account"});
  try{await signInWithPopup(auth,pr)}
  catch(x){
    if(x.code==="auth/popup-blocked"||x.code==="auth/operation-not-supported-in-this-environment"){try{await signInWithRedirect(auth,pr);return}catch(y){x=y}}
    if(x.code!=="auth/cancelled-popup-request")$("ae").textContent=errText(x);
  }
};
if(CFG.botName&&CFG.workerUrl){
  window.onTelegramAuth=async u=>{
    $("ae").textContent="";
    try{
      const r=await fetch(CFG.workerUrl,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(u)});
      const j=await r.json();if(!r.ok||!j.token)throw{userMessage:j.error||"Не удалось войти через Telegram."};
      tgProfile=j.profile;await signInWithCustomToken(auth,j.token);
    }catch(x){$("ae").textContent=errText(x)}
  };
  const s=document.createElement("script");s.async=true;s.src="https://telegram.org/js/telegram-widget.js?22";
  s.dataset.telegramLogin=CFG.botName;s.dataset.size="large";s.dataset.radius="16";s.dataset.requestAccess="write";s.dataset.onauth="onTelegramAuth(user)";
  $("tg").append(s);
}else{$("tg").hidden=true;$("tg").previousElementSibling.hidden=true}

/* ---------- профиль ---------- */
async function saveProfile(uid,p,oldUn,isNew){
  const b=writeBatch(db),un=p.username;
  if(un!==oldUn){b.set(doc(db,"usernames",un),{uid});if(oldUn)b.delete(doc(db,"usernames",oldUn))}
  const d={name:p.name,nameLower:p.name.toLowerCase(),username:un,photo:p.photo||""};
  if(p.tg)d.tg=p.tg;
  if(isNew){d.color=colorOf(uid);d.createdAt=serverTimestamp()}
  b.set(doc(db,"users",uid),d,{merge:true});await b.commit();
}
const drawMe=()=>$("meb").replaceChildren(avatar(meDoc,"sm"));
const drawP=()=>$("pav").replaceChildren(avatar({name:$("pn").value,photo:pPhoto,color:meDoc.color},"lg"));
function srcs(){
  const g=me.providerData.find(p=>p.providerId==="google.com"),t=tgProfile||(meDoc&&meDoc.tg);
  return{g:g&&{name:g.displayName||"",photo:g.photoURL||""},t:t&&{name:t.name||"",photo:t.photo||""}};
}
function fill(x){$("pn").value=x.name;pPhoto=x.photo;drawP()}
$("pig").onclick=()=>fill(srcs().g);$("pit").onclick=()=>fill(srcs().t);
function openProfile(force){
  pPhoto=meDoc.photo||"";$("pt").textContent=force?"Завершим профиль":"Профиль";
  $("pn").value=meDoc.name==="Гость"?"":meDoc.name||"";$("pu").value=meDoc.username||"";$("pe").textContent="";$("pc").hidden=force;
  const s=srcs();$("pig").hidden=!s.g;$("pit").hidden=!s.t;$("pnt").hidden=!("Notification" in window)||Notification.permission==="granted";drawP();$("pm").hidden=false;
}
$("meb").onclick=()=>meDoc&&openProfile(false);
$("pph").onclick=()=>pickPhoto(p=>{pPhoto=p;drawP()});
$("ppr").onclick=()=>{pPhoto="";drawP()};$("pn").oninput=drawP;
$("pc").onclick=()=>{$("pm").hidden=true};
$("po").onclick=async()=>{$("pm").hidden=true;if(call)endCall("",true);stopHb();await setPresence(false);await unregisterPush();signOut(auth)};
$("ps").onclick=async()=>{
  const name=$("pn").value.trim(),un=$("pu").value.trim().toLowerCase().replace(/^@/,"");$("pe").textContent="";
  if(!name){$("pe").textContent="Введите имя.";return}
  if(!UN_RE.test(un)){$("pe").textContent=UN_MSG;return}
  $("ps").disabled=true;
  try{
    if(un!==meDoc.username){const t=await getDoc(doc(db,"usernames",un));if(t.exists()&&t.data().uid!==me.uid)throw{userMessage:"Этот username уже занят."}}
    await saveProfile(me.uid,{name,username:un,photo:pPhoto,tg:tgProfile||meDoc.tg},meDoc.username||null,!!meDoc._new);$("pm").hidden=true;
  }catch(x){$("pe").textContent=x.code==="permission-denied"?"Не удалось сохранить: username занят или недоступен.":errText(x)}
  $("ps").disabled=false;
};

onAuthStateChanged(auth,async u=>{
  $("splash").hidden=true;
  unsubs.forEach(f=>f());unsubs=[];unsubMsgs&&unsubMsgs();unsubMsgs=null;
  if(!u){clearInterval(hb);hb=null;presOn=false;marked.clear();chatsInit=false;lastMs.clear();pushDone=false;fcmToken=null;unsubPeer&&unsubPeer();unsubPeer=null;tgProfile=null;draft={};me=meDoc=null;cur=peer=null;chats=[];found=null;lastDocs=[];cache.clear();
    $("app").hidden=true;$("pm").hidden=true;$("auth").hidden=false;$("app").classList.remove("open");$("chat").classList.add("idle");return}
  me=u;$("auth").hidden=true;$("app").hidden=false;
  const ref=doc(db,"users",u.uid);
  try{
    const snap=await getDoc(ref);
    if(!snap.exists()){
      if(pending&&pending.username){
        try{await saveProfile(u.uid,{name:pending.name,username:pending.username,photo:pending.photo},null,true)}
        catch(x){draft={name:pending.name,photo:pending.photo};toast("Этот username уже занят. Выберите другой.")}
        pending=null;
      }
    }else if(tgProfile)await setDoc(ref,{tg:tgProfile},{merge:true});
  }catch(e){toast(errText(e))}
  unsubs.push(onSnapshot(ref,s=>{
    meDoc=s.exists()?{uid:u.uid,...s.data()}:{uid:u.uid,name:draft.name||"",photo:draft.photo||"",color:colorOf(u.uid),_new:true};
    cache.set(u.uid,meDoc);drawMe();
    if(!meDoc.username&&$("pm").hidden)openProfile(true);redraw();
    if(meDoc.username&&!presOn){presOn=true;startPresence();if(canNotif())registerPush()}
  },e=>toast(errText(e))));
  unsubs.push(onSnapshot(query(collection(db,"chats"),where("members","array-contains",u.uid)),s=>{
    chats=s.docs.map(d=>({id:d.id,...d.data()}));loadUsers(chats.map(c=>c.members.find(x=>x!==u.uid)));drawList();
    notifyNew();if(cur&&lastDocs.length)renderMsgs(lastDocs,false);markDelivery();
  },e=>toast(errText(e))));
  listenCalls(u);
});

/* ---------- «в сети» и галочки ---------- */
const tms=v=>v&&v.toMillis?v.toMillis():0;
function statusOf(p){
  const ls=tms(p.lastSeen),now=Date.now();
  if(!ls)return{t:"не в сети"};
  if(p.online&&now-ls<150000)return{t:"в сети",on:true};
  const diff=now-ls,d=new Date(ls),hm=d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
  if(diff<60000)return{t:"был(а) только что"};
  if(diff<3600000)return{t:`был(а) ${Math.floor(diff/60000)} мин. назад`};
  if(d.toDateString()===new Date(now).toDateString())return{t:`был(а) сегодня в ${hm}`};
  if(d.toDateString()===new Date(now-864e5).toDateString())return{t:`был(а) вчера в ${hm}`};
  return{t:`был(а) ${d.toLocaleDateString("ru-RU",{day:"numeric",month:"long"})}`};
}
function setPresence(on){
  if(!me||!meDoc||meDoc._new||!meDoc.username)return Promise.resolve();
  return setDoc(doc(db,"users",me.uid),{online:on,lastSeen:serverTimestamp()},{merge:true}).catch(()=>{});
}
function stopHb(){clearInterval(hb);hb=null}
function startPresence(){
  stopHb();if(document.visibilityState!=="visible")return;
  setPresence(true);hb=setInterval(()=>{if(document.visibilityState==="visible")setPresence(true)},60000);
}
const marked=new Set();
function markDelivery(){ // «доставлено» — приложение получило сообщение, «прочитано» — чат открыт на экране
  if(!me||!chats.length)return;
  for(const c of chats){
    if(c.lastFrom===me.uid||!c.lastAt)continue;
    const la=tms(c.lastAt);if(!la)continue;
    const reading=c.id===cur&&document.visibilityState==="visible",type=reading?"seen":"got";
    if(tms(c[type]&&c[type][me.uid])>=la)continue;
    const k=c.id+":"+la+":"+type;if(marked.has(k))continue;marked.add(k);
    const f={[me.uid]:serverTimestamp()};
    setDoc(doc(db,"chats",c.id),reading?{seen:f,got:f}:{got:f},{merge:true}).catch(()=>marked.delete(k));
  }
}
document.addEventListener("visibilitychange",()=>{
  if(!me)return;
  if(document.visibilityState==="visible"){startPresence();markDelivery()}else{stopHb();setPresence(false)}
});
addEventListener("pagehide",()=>setPresence(false));
setInterval(()=>{if(cur&&peer&&peer.uid!=="global")refreshHead()},30000);

/* ---------- звонки (WebRTC; сигналы идут через Firestore) ---------- */
const ICE=[{urls:["stun:stun.l.google.com:19302","stun:stun.cloudflare.com:3478"]},...(CFG.ice||[])];
let call=null,incoming=null,incUnsub=null,incTimer=null,ringT=null,ringCtx=null;
const sigW=(c,o)=>setDoc(doc(collection(db,"calls",c.id,"sig")),{from:me.uid,n:++c.n,...o}).catch(()=>{});
const fmtT=ms=>{const s=Math.floor(ms/1000);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
function mediaErr(x){
  if(!navigator.mediaDevices)return "Звонки работают только по защищённому адресу (https).";
  if(x&&x.name==="NotAllowedError")return "Нет доступа к микрофону или камере. Разрешите его в настройках браузера.";
  if(x&&x.name==="NotFoundError")return "Микрофон или камера не найдены.";
  return "Не удалось включить микрофон или камеру.";
}
function ring(on){
  clearInterval(ringT);ringT=null;
  if(!on){navigator.vibrate&&navigator.vibrate(0);return}
  const beep=()=>{
    try{ringCtx=ringCtx||new (window.AudioContext||window.webkitAudioContext)();const o=ringCtx.createOscillator(),g=ringCtx.createGain();
      o.frequency.value=720;g.gain.value=.12;o.connect(g);g.connect(ringCtx.destination);o.start();o.stop(ringCtx.currentTime+.35)}catch{}
    navigator.vibrate&&navigator.vibrate([300,150,300]);
  };
  beep();ringT=setInterval(beep,1800);
}
function listenCalls(u){
  unsubs.push(onSnapshot(query(collection(db,"calls"),where("to","==",u.uid),where("status","==","ringing")),s=>{
    s.docChanges().forEach(ch=>{

async function startCall(video){

async function acceptCall(d){

function openCall(c,stream,video){

  };

  c.unsubs.push(onSnapshot(query(collection(db,"calls",c.id,"sig"),orderBy("n")),s=>{
    s.docChanges().forEach(ch=>{if(ch.type!=="added")return;const m=ch.doc.data();if(m.from===me.uid)return;c.q=c.q.then(()=>onSig(c,m)).catch(()=>{})});
  },()=>{}));

async function onSig(c,m){

function endCall(msg,write,outcome){

const lastMs=new Map();let chatsInit=false;
function notifyNew(){
  for(const c of chats){
    const la=tms(c.lastAt),prev=lastMs.get(c.id)||0;
    if(chatsInit&&c.lastFrom&&c.lastFrom!==me.uid&&la>prev&&(document.visibilityState!=="visible"||c.id!==cur)){
      const o=cache.get(c.members.find(x=>x!==me.uid)),txt=c.lastText||"Новое сообщение";
      if(document.visibilityState==="visible")toast((o?o.name+": ":"")+txt);else notify(o?o.name:"NovaChat",txt,c.id);

/* ---------- голосовые сообщения и «кружки» ---------- */
// Записи хранятся в Firestore (бесплатного файлового хранилища нет), поэтому они короткие: документ не больше 1 МБ.
const MAXB=640000,mmss=n=>Math.floor(n/60)+":"+String(Math.floor(n%60)).padStart(2,"0");
const pickMime=l=>l.find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||"";
const blobB64=b=>new Promise((res,rej)=>{const f=new FileReader();f.onload=()=>res(String(f.result).split(",")[1]||"");f.onerror=rej;f.readAsDataURL(b)});
let rec=null;
function syncComposer(){$("mf").classList.toggle("has",!!$("mt").value.trim())}
function recSupported(){if(!(navigator.mediaDevices&&window.MediaRecorder)){toast("Запись не поддерживается в этом браузере.");return false}return true}
function startRecorder(kind,outStream,opts){
  const mime=pickMime(kind==="voice"?["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg;codecs=opus"]:["video/webm;codecs=vp8,opus","video/webm;codecs=vp9,opus","video/webm","video/mp4"]);
  const mr=new MediaRecorder(outStream,{...(mime?{mimeType:mime}:{}),...opts});
  const r=rec={kind,mr,chunks:[],bytes:0,t0:Date.now(),mime:mr.mimeType||mime,cancel:false,levels:[],max:kind==="voice"?180:30,chat:cur,streams:[]};
  mr.ondataavailable=e=>{if(e.data&&e.data.size){r.chunks.push(e.data);r.bytes+=e.data.size;if(r.bytes>MAXB)finishRec(false)}};
  mr.onstop=()=>onRecStop(r);
  mr.start(500);
  r.tick=setInterval(()=>{
    const s=(Date.now()-r.t0)/1000;$("rtm").textContent=$("ctm").textContent=mmss(s);
    $("cm").style.setProperty("--p",Math.min(100,Math.max(s/r.max,r.bytes/MAXB)*100));
    if(s>=r.max)finishRec(false);
  },100);
  return r;
}
function finishRec(cancel){const r=rec;if(!r)return;r.cancel=cancel;if(r.mr.state!=="inactive")r.mr.stop();else onRecStop(r)}
async function onRecStop(r){
  if(rec!==r)return;rec=null;
  clearInterval(r.tick);clearInterval(r.lv);cancelAnimationFrame(r.raf);r.ctx&&r.ctx.close().catch(()=>{});
  r.streams.forEach(st=>st.getTracks().forEach(t=>t.stop()));
  $("mf").classList.remove("rec");$("cm").hidden=true;
  if(r.cancel||!r.chunks.length)return;
  try{await sendRecorded(r)}catch(x){toast(errText(x))}
}
function drawLv(r){
  const c=$("rlv"),x=c.getContext("2d"),w=c.width=c.clientWidth||140,h=c.height=28;
  x.fillStyle=getComputedStyle(document.body).color;
  const a=r.levels.slice(-Math.floor(w/5));a.forEach((v,i)=>{const bh=Math.max(3,v*h);x.fillRect(w-(a.length-i)*5,(h-bh)/2,3,bh)});
}
async function startVoice(){
  if(rec||!cur||!recSupported())return;
  let st;try{st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}catch(x){toast(mediaErr(x));return}
  const r=startRecorder("voice",st,{audioBitsPerSecond:24000});r.streams=[st];
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)(),an=ctx.createAnalyser(),buf=new Uint8Array(512);
    an.fftSize=512;ctx.createMediaStreamSource(st).connect(an);r.ctx=ctx;
    r.lv=setInterval(()=>{an.getByteTimeDomainData(buf);let m=0;for(const v of buf)m=Math.max(m,Math.abs(v-128));r.levels.push(Math.min(1,m/90));drawLv(r)},80);
  }catch{}
  $("mf").classList.add("rec");
}
async function startCircle(){
  if(rec||!cur||!recSupported())return;
  const vc=f=>({video:{facingMode:f,width:{ideal:480},height:{ideal:480}}});
  let st;try{st=await navigator.mediaDevices.getUserMedia({...vc("user"),audio:{echoCancellation:true,noiseSuppression:true}})}catch(x){toast(mediaErr(x));return}
  const v=document.createElement("video");v.muted=true;v.playsInline=true;v.srcObject=st;await v.play().catch(()=>{});
  const cv=$("ccv"),cx=cv.getContext("2d");cv.style.transform="scaleX(-1)";
  const out=cv.captureStream(24);st.getAudioTracks().forEach(t=>out.addTrack(t));
  const r=startRecorder("circle",out,{videoBitsPerSecond:140000,audioBitsPerSecond:16000});r.streams=[st,out];r.v=v;r.front=true;r.vc=vc;
  const draw=()=>{if(rec!==r)return;const w=v.videoWidth||240,h=v.videoHeight||240,m=Math.min(w,h);cx.drawImage(v,(w-m)/2,(h-m)/2,m,m,0,0,240,240);r.raf=requestAnimationFrame(draw)};
  draw();$("cm").hidden=false;
}
async function flipCamera(){
  const r=rec;if(!r||r.kind!=="circle"||r.flipping)return;r.flipping=true;
  const old=r.v.srcObject,want=!r.front;
  old.getVideoTracks().forEach(t=>t.stop()); // на многих телефонах вторую камеру можно открыть, только освободив первую
  let ns=null;
  for(const f of [want,!want]){ // если новая камера не открылась, возвращаем прежнюю
    try{ns=await navigator.mediaDevices.getUserMedia(r.vc(f?"user":"environment"));r.front=f;break}catch{}
  }
  r.flipping=false;
  if(!ns){toast("Камера недоступна. Запись остановлена.");finishRec(true);return}
  if(r.front!==want)toast("Не удалось переключить камеру.");
  r.v.srcObject=ns;r.streams.push(ns);$("ccv").style.transform=r.front?"scaleX(-1)":"";await r.v.play().catch(()=>{});
}
function makeWave(lv){
  const n=40,out=[];
  for(let i=0;i<n;i++){const a=Math.floor(i*lv.length/n),b=Math.max(a+1,Math.floor((i+1)*lv.length/n));let m=0;for(let j=a;j<b&&j<lv.length;j++)m=Math.max(m,lv[j]);out.push(m)}
  const mx=Math.max(...out,0.01);return out.map(v=>Math.round(v/mx*100));
}
function makePoster(blob){return new Promise((res,rej)=>{
  const v=document.createElement("video"),u=URL.createObjectURL(blob);v.muted=true;v.playsInline=true;v.src=u;
  const fail=()=>{URL.revokeObjectURL(u);rej(new Error("poster"))};
  v.onloadeddata=()=>{v.currentTime=0.3};
  v.onseeked=()=>{try{const c=document.createElement("canvas");c.width=c.height=96;c.getContext("2d").drawImage(v,0,0,96,96);const d=c.toDataURL("image/jpeg",.6);URL.revokeObjectURL(u);res(d)}catch{fail()}};
  v.onerror=fail;setTimeout(fail,4000);
})}
async function sendRecorded(r){
  const blob=new Blob(r.chunks,{type:r.mime||r.chunks[0].type}),dur=Math.round((Date.now()-r.t0)/1000);
  if(dur<1){toast("Слишком короткое сообщение.");return}
  const data=await blobB64(blob);
  if(data.length>900000){toast("Запись получилась слишком большой.");return}
  const o={text:r.kind==="voice"?"🎤 Голосовое сообщение":"📹 Видеосообщение",type:r.kind,dur,mime:blob.type||r.mime};
  if(r.kind==="voice")o.wave=makeWave(r.levels);
  else{const p=await makePoster(blob).catch(()=>"");if(p)o.poster=p}
  if(replyTo){o.reply=replyTo;clearCtx()}

async function togglePlay(m,kind){

async function postMsg(id,o,media){
  const b=writeBatch(db);
  if(media){const mr=doc(collection(db,"chats",id,"media"));b.set(mr,{from:me.uid,createdAt:serverTimestamp(),...media});o={...o,mid:mr.id}}
  b.set(doc(collection(db,"chats",id,"messages")),{from:me.uid,createdAt:serverTimestamp(),...o});
  if(id!=="global")b.set(doc(db,"chats",id),{members:id.split("_"),lastText:o.text.slice(0,120),lastFrom:me.uid,lastAt:serverTimestamp(),seen:{[me.uid]:serverTimestamp()}},{merge:true});
  await b.commit();
  if(id!=="global")pushNotify({type:"msg",chat:id});
}
$("mf").onsubmit=async e=>{
  e.preventDefault();const text=mt.value.trim();if(!text||!cur)return;
  const ed=editing,rp=replyTo;mt.value="";mt.style.height="auto";replyTo=editing=null;$("ctx").hidden=true;syncComposer();
  try{
    if(ed)await updateDoc(doc(db,"chats",cur,"messages",ed.id),{text,edited:true});
    else await postMsg(cur,rp?{text,reply:rp}:{text});
  }catch(x){mt.value=text;syncComposer();toast(errText(x))}
};
