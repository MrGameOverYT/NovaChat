<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D1628">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NovaChat">
<title>NovaChat</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath d='M20 2l4 14 14 4-14 4-4 14-4-14L2 20l14-4z' fill='%23FF6B4A'/%3E%3Ccircle cx='20' cy='20' r='5' fill='%23C6F25C'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF6EA;--panel:#FFFBF5;--ink:#1D1628;--mute:#7A6F88;--own:#C6F25C;--ownink:#1D1628;--other:#E9DFFF;--acc:#FF6B4A;--lil:#B79CFF;--line:#EADFCF}
@media(prefers-color-scheme:dark){:root{--bg:#130F1B;--panel:#1B1526;--ink:#F5EEFF;--mute:#9B8FB0;--other:#2B2140;--acc:#FF7A5C;--line:#2E2440}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font:16px/1.4 Manrope,system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
h1,h2,.logo b{font-family:Unbounded,Manrope,sans-serif;font-weight:700}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
[hidden]{display:none!important}
.logo{display:flex;align-items:center;gap:10px}.logo svg{width:34px;height:34px;animation:spin 14s linear infinite}.logo b{font-size:20px;letter-spacing:-.5px}
@keyframes spin{to{transform:rotate(360deg)}}
/* вход */
#auth{height:100%;display:grid;place-items:center;padding:20px;background:radial-gradient(520px 360px at 85% 5%,rgba(183,156,255,.35),transparent),radial-gradient(460px 340px at 5% 95%,rgba(255,107,74,.28),transparent),var(--bg);overflow:auto}
.card{width:100%;max-width:400px;background:var(--panel);border:2px solid var(--ink);border-radius:32px 8px 32px 8px;padding:26px;box-shadow:8px 8px 0 var(--acc);display:grid;gap:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:14px;padding:4px}
.tabs button{padding:9px;border-radius:11px;font-weight:600;color:var(--mute)}.tabs .on{background:var(--ink);color:var(--bg)}
.card input{width:100%;padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);outline:0}.card input:focus{border-color:var(--lil)}
.btn{background:var(--acc);color:#1D1628;font-weight:800;padding:13px;border-radius:14px;width:100%;transition:transform .15s}.btn:active{transform:scale(.97)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px;border-radius:14px;border:2px solid var(--ink);font-weight:800;background:var(--bg);transition:transform .15s}.gbtn:active{transform:scale(.97)}.gbtn svg{width:20px;height:20px}
.or{text-align:center;color:var(--mute);font-size:13px}#tg{display:flex;justify-content:center;min-height:40px}
.err{color:#D8344A;font-size:14px;min-height:18px}
/* приложение */
#app{height:100%;display:grid;grid-template-columns:350px 1fr;position:relative}
#side{background:var(--panel);border-right:2px solid var(--line);display:flex;flex-direction:column;min-height:0}
.shead{padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
.search{margin:0 14px 10px;padding:11px 16px;border-radius:99px;border:2px solid var(--line);background:var(--bg);outline:0;width:calc(100% - 28px)}.search:focus{border-color:var(--lil)}
#list{overflow:auto;flex:1;padding:0 8px 12px}
.item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px;border-radius:18px 6px 18px 6px;transition:background .15s}
.item:hover,.item.on{background:var(--other)}.item div{min-width:0}.item b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item small{color:var(--mute)}
.av{width:44px;height:44px;border-radius:15px 5px 15px 5px;flex:none;display:grid;place-items:center;font:700 18px Unbounded,sans-serif;color:#1D1628;overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}
.av.sm{width:36px;height:36px;font-size:15px}
#chat{display:flex;flex-direction:column;min-height:0;background:radial-gradient(500px 320px at 95% 0,rgba(183,156,255,.22),transparent),radial-gradient(420px 300px at 0 100%,rgba(255,107,74,.15),transparent),var(--bg)}
.chead{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--panel);border-bottom:2px solid var(--line);padding-top:max(10px,env(safe-area-inset-top))}
.chead b{display:block}.chead small{color:var(--mute)}
#back{display:none;font-size:26px;width:38px;height:38px;border-radius:12px}
#msgs{flex:1;overflow:auto;padding:16px 14px;display:flex;flex-direction:column;gap:6px}
.day{align-self:center;font-size:12px;color:var(--mute);background:var(--panel);padding:3px 12px;border-radius:99px;margin:8px 0}
.row{display:flex;gap:8px;align-items:flex-end}.row.me{justify-content:flex-end}
.b{max-width:min(78%,520px);padding:9px 14px 6px;animation:pop .25s cubic-bezier(.3,1.5,.5,1);word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap}
.me .b{background:var(--own);color:var(--ownink);border-radius:24px 4px 24px 4px}
.ot .b{background:var(--other);border-radius:4px 24px 4px 24px}
.b .n{font-size:12px;font-weight:800;color:var(--acc);display:block}.b time{display:block;text-align:right;font-size:11px;opacity:.6;margin-top:1px}
@keyframes pop{from{opacity:0;transform:scale(.85) rotate(-2deg)}}
form{display:flex;gap:10px;padding:10px 14px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:var(--panel);border-top:2px solid var(--line);align-items:flex-end}
textarea{flex:1;resize:none;max-height:120px;padding:11px 16px;border-radius:22px 6px 22px 22px;border:2px solid var(--line);background:var(--bg);outline:0}textarea:focus{border-color:var(--lil)}
#send{width:46px;height:46px;border-radius:16px 5px 16px 5px;background:var(--acc);display:grid;place-items:center;flex:none}#send svg{width:22px;height:22px}
.empty{margin:auto;text-align:center;color:var(--mute);display:grid;gap:10px;justify-items:center}.empty svg{width:70px;height:70px;opacity:.9}
#chat.idle .chead,#chat.idle form{display:none}#chat:not(.idle) .empty{display:none}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:16px;max-width:90%;z-index:9;animation:pop .2s}
.setup{padding:30px;text-align:center;display:grid;gap:8px;justify-items:center;max-width:420px;margin:auto}
@media(max-width:780px){
 #app{grid-template-columns:1fr}
 #side,#chat{position:absolute;inset:0;transition:transform .3s cubic-bezier(.3,.9,.3,1)}
 #chat{transform:translateX(100%)}#app.open #chat{transform:none}#app.open #side{transform:translateX(-25%)}
 #back{display:block}
}
</style>
</head>
<body>
<script>
/* ===== НАСТРОЙКИ: вставьте свои значения ===== */
const CFG = {
  firebase: {                 // Firebase → Параметры проекта → Ваши приложения → Конфигурация
    apiKey: "AIzaSyCYArT1thXOiZUtcU0kff5_5JqtGZQecMg",
    authDomain: "novachat-d1749.firebaseapp.com",
    projectId: "novachat-d1749",
    appId: "1:872918771963:web:05e7e7773a70664baf285e"
  },
  botName: "NovaChatAuthBot",                // имя бота из @BotFather БЕЗ @, например "NovaChatLoginBot"
  workerUrl: "https://novachat.townhip-mos.workers.dev"               // адрес Cloudflare Worker, например "https://novachat.имя.workers.dev"
};
/* ============================================= */
</script>

<section id="auth">
  <div class="card">
    <div class="logo"><svg viewBox="0 0 40 40"><path d="M20 2l4 14 14 4-14 4-4 14-4-14L2 20l14-4z" fill="#FF6B4A"/><circle cx="20" cy="20" r="5" fill="#C6F25C"/></svg><b>NovaChat</b></div>
    <div class="tabs"><button id="tIn" class="on" type="button">Вход</button><button id="tUp" type="button">Регистрация</button></div>
    <form id="af" style="display:grid;gap:12px;padding:0;border:0;background:none">
      <input id="nm" placeholder="Ваше имя" maxlength="40" autocomplete="name" hidden>
      <input id="em" type="email" placeholder="Почта" autocomplete="email" required>
      <input id="pw" type="password" placeholder="Пароль (от 6 символов)" autocomplete="current-password" required>
      <div class="err" id="ae"></div>
      <button class="btn" id="ab">Войти</button>
    </form>
    <button class="gbtn" id="gb" type="button"><svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.2 5.5-4.7 7.2l7.5 5.8c4.4-4.1 7-10.1 7-17.5z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>Войти через Google</button>
    <div class="or">или</div>
    <div id="tg"></div>
  </div>
</section>

<div id="app" hidden>
  <aside id="side">
    <div class="shead">
      <div class="logo"><svg viewBox="0 0 40 40"><path d="M20 2l4 14 14 4-14 4-4 14-4-14L2 20l14-4z" fill="#FF6B4A"/><circle cx="20" cy="20" r="5" fill="#C6F25C"/></svg><b>NovaChat</b></div>
      <button id="out" title="Выйти" style="color:var(--mute);font-size:14px;font-weight:600">Выйти</button>
    </div>
    <input class="search" id="q" placeholder="Поиск людей…" autocomplete="off">
    <div id="list"></div>
  </aside>
  <main id="chat" class="idle">
    <div class="chead">
      <button id="back" aria-label="Назад">←</button>
      <div class="av sm" id="hav"></div>
      <div><b id="ht"></b><small id="hs"></small></div>
    </div>
    <div id="msgs"></div>
    <div class="empty"><svg viewBox="0 0 40 40"><path d="M20 2l4 14 14 4-14 4-4 14-4-14L2 20l14-4z" fill="#FF6B4A"/><circle cx="20" cy="20" r="5" fill="#C6F25C"/></svg><h2>Выберите чат</h2><span>или найдите человека слева</span></div>
    <form id="mf">
      <textarea id="mt" rows="1" maxlength="2000" placeholder="Напишите сообщение…"></textarea>
      <button id="send" aria-label="Отправить"><svg viewBox="0 0 24 24" fill="#1D1628"><path d="M3 20l18-8L3 4v6l11 2-11 2z"/></svg></button>
    </form>
  </main>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signInWithCustomToken,updateProfile,signOut,GoogleAuthProvider,signInWithPopup,signInWithRedirect} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,setDoc,addDoc,onSnapshot,query,orderBy,limit,limitToLast,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
const $=id=>document.getElementById(id);
const COLORS=["#FF6B4A","#C6F25C","#B79CFF","#FFC857","#7DE2C3","#FF8FB1"];
const colorOf=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return COLORS[h%COLORS.length]};
const ERR={
 "auth/invalid-email":"Некорректный адрес почты.","auth/missing-password":"Введите пароль.",
 "auth/weak-password":"Пароль слишком короткий — нужно минимум 6 символов.",
 "auth/email-already-in-use":"Эта почта уже зарегистрирована. Попробуйте войти.",
 "auth/invalid-credential":"Неверная почта или пароль.","auth/user-not-found":"Пользователь не найден.",
 "auth/wrong-password":"Неверный пароль.","auth/too-many-requests":"Слишком много попыток. Подождите немного.",
 "auth/network-request-failed":"Нет связи с интернетом.","auth/operation-not-allowed":"Вход по почте не включён в Firebase (Authentication → Sign-in method).",
 "auth/unauthorized-domain":"Домен сайта не добавлен в Authorized domains в Firebase.",
 "auth/popup-closed-by-user":"Окно входа закрыто.","auth/popup-blocked":"Браузер заблокировал окно входа. Разрешите всплывающие окна.",
 "permission-denied":"Нет доступа. Проверьте правила Firestore.","unavailable":"Сервер недоступен. Проверьте интернет."
};
const errText=e=>ERR[e.code&&e.code.replace("firestore/","")]||ERR[e.code]||e.userMessage||"Что-то пошло не так. Попробуйте ещё раз.";
function toast(t){const d=document.createElement("div");d.id="toast";d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),3500)}

if(!CFG.firebase.apiKey||!CFG.firebase.projectId){
  document.body.innerHTML="";const s=document.createElement("div");s.className="setup";
  const h=document.createElement("h2");h.textContent="NovaChat ещё не настроен";
  const p=document.createElement("p");p.textContent="Откройте index.html и впишите ключи Firebase в блок CFG вверху файла.";
  s.append(h,p);document.body.append(s);throw new Error("CFG пуст");
}
const app=initializeApp(CFG.firebase),auth=getAuth(app),db=getFirestore(app);

/* аватар */
function avatar(u,cls=""){
  const d=document.createElement("div");d.className="av "+cls;d.style.background=u.color||colorOf(u.uid||"x");
  const letter=()=>{d.textContent=(u.name||"?").trim().charAt(0).toUpperCase()};
  if(u.photo){const i=new Image();i.src=u.photo;i.referrerPolicy="no-referrer";i.alt="";i.onerror=()=>{i.remove();letter()};d.append(i)}else letter();
  return d;
}

/* ---------- вход ---------- */
let mode="in",regName="",tgProfile=null;
function setMode(m){mode=m;$("tIn").classList.toggle("on",m==="in");$("tUp").classList.toggle("on",m==="up");
  $("nm").hidden=m==="in";$("ab").textContent=m==="in"?"Войти":"Создать аккаунт";$("ae").textContent="";
  $("pw").autocomplete=m==="in"?"current-password":"new-password"}
$("tIn").onclick=()=>setMode("in");$("tUp").onclick=()=>setMode("up");
$("af").onsubmit=async e=>{
  e.preventDefault();$("ae").textContent="";$("ab").disabled=true;
  try{
    const em=$("em").value.trim(),pw=$("pw").value;
    if(mode==="up"){
      const name=$("nm").value.trim();if(!name){throw{userMessage:"Введите имя."}}
      regName=name;const c=await createUserWithEmailAndPassword(auth,em,pw);
      await updateProfile(c.user,{displayName:name});
      await setDoc(doc(db,"users",c.user.uid),{name,nameLower:name.toLowerCase()},{merge:true});
    }else await signInWithEmailAndPassword(auth,em,pw);
  }catch(x){regName="";$("ae").textContent=errText(x)}
  $("ab").disabled=false;
};
if(CFG.botName&&CFG.workerUrl){
  window.onTelegramAuth=async u=>{
    $("ae").textContent="";
    try{
      const r=await fetch(CFG.workerUrl,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(u)});
      const j=await r.json();if(!r.ok||!j.token)throw{userMessage:j.error||"Не удалось войти через Telegram."};
      tgProfile=j.profile;await signInWithCustomToken(auth,j.token);
    }catch(x){$("ae").textContent=errText(x)}
  };
  const s=document.createElement("script");s.async=true;s.src="https://telegram.org/js/telegram-widget.js?22";
  s.dataset.telegramLogin=CFG.botName;s.dataset.size="large";s.dataset.radius="16";s.dataset.requestAccess="write";s.dataset.onauth="onTelegramAuth(user)";
  $("tg").append(s);
}else{$("tg").hidden=true;$("tg").previousElementSibling.hidden=true}
$("gb").onclick=async()=>{
  $("ae").textContent="";const pr=new GoogleAuthProvider();pr.setCustomParameters({prompt:"select_account"});
  try{await signInWithPopup(auth,pr)}
  catch(x){
    if(x.code==="auth/popup-blocked"||x.code==="auth/operation-not-supported-in-this-environment"){try{await signInWithRedirect(auth,pr);return}catch(y){x=y}}
    if(x.code!=="auth/cancelled-popup-request")$("ae").textContent=errText(x);
  }
};
$("out").onclick=()=>signOut(auth);

/* ---------- профиль и данные ---------- */
let me=null,users=new Map(),unsubUsers=null,cur=null,unsubMsgs=null,peer=null;
async function ensureProfile(u){
  const ref=doc(db,"users",u.uid),snap=await getDoc(ref);
  const name=(tgProfile&&tgProfile.name)||regName||u.displayName||(u.email||"Гость").split("@")[0];
  const data={name:snap.exists()&&!tgProfile&&!regName?snap.data().name:name};
  data.nameLower=data.name.toLowerCase();data.color=snap.exists()&&snap.data().color||colorOf(u.uid);
  const ph=(tgProfile&&tgProfile.photo)||u.photoURL;if(ph)data.photo=ph;
  if(!snap.exists())data.createdAt=serverTimestamp();
  await setDoc(ref,data,{merge:true});
}
onAuthStateChanged(auth,async u=>{
  if(u){
    try{await ensureProfile(u)}catch(e){toast(errText(e))}
    me=u;$("auth").hidden=true;$("app").hidden=false;
    unsubUsers&&unsubUsers();
    unsubUsers=onSnapshot(query(collection(db,"users"),limit(300)),s=>{
      users=new Map(s.docs.map(d=>[d.id,{uid:d.id,...d.data()}]));drawList();if(cur&&peer)refreshHead();
    },e=>toast(errText(e)));
  }else{
    me=null;unsubUsers&&unsubUsers();unsubMsgs&&unsubMsgs();cur=null;
    $("app").hidden=true;$("auth").hidden=false;$("app").classList.remove("open");$("chat").classList.add("idle");
  }
});

/* ---------- список ---------- */
const GLOBAL={uid:"global",name:"Общий чат",color:"#B79CFF"};
const chatId=p=>p.uid==="global"?"global":[me.uid,p.uid].sort().join("_");
function drawList(){
  const q=$("q").value.trim().toLowerCase(),box=$("list");box.textContent="";
  const add=(p,sub)=>{
    const b=document.createElement("button");b.className="item"+(cur===chatId(p)?" on":"");
    const t=document.createElement("div"),n=document.createElement("b"),s=document.createElement("small");
    n.textContent=p.name+(me&&p.uid===me.uid?" (вы)":"");s.textContent=sub;t.append(n,s);
    b.append(avatar(p),t);b.onclick=()=>openChat(p);box.append(b);
  };
  if(!q||"общий чат".includes(q))add(GLOBAL,"Все участники");
  [...users.values()].filter(u=>u.uid!==me.uid&&(!q||(u.nameLower||"").includes(q)))
    .sort((a,b)=>(a.name||"").localeCompare(b.name||"","ru")).forEach(u=>add(u,"Личный чат"));
  if(!box.children.length){const e=document.createElement("p");e.style.cssText="padding:20px;color:var(--mute);text-align:center";e.textContent="Никого не нашли";box.append(e)}
}
$("q").oninput=drawList;

/* ---------- чат ---------- */
function refreshHead(){const p=peer.uid==="global"?GLOBAL:users.get(peer.uid)||peer;$("hav").replaceWith(Object.assign(avatar(p,"sm"),{id:"hav"}));$("ht").textContent=p.name;$("hs").textContent=p.uid==="global"?`Участников: ${users.size}`:"Личный чат"}
function openChat(p){
  const wasOpen=$("app").classList.contains("open");
  peer=p;cur=chatId(p);unsubMsgs&&unsubMsgs();$("msgs").textContent="";
  $("chat").classList.remove("idle");$("app").classList.add("open");refreshHead();drawList();
  if(!wasOpen)history.pushState({c:1},"");
  let first=true;
  unsubMsgs=onSnapshot(query(collection(db,"chats",cur,"messages"),orderBy("createdAt"),limitToLast(200)),s=>{
    renderMsgs(s.docs,first);first=false;
  },e=>toast(errText(e)));
  if(innerWidth>780)$("mt").focus();
}
function closeChat(){unsubMsgs&&unsubMsgs();unsubMsgs=null;cur=null;peer=null;$("app").classList.remove("open");$("chat").classList.add("idle");drawList()}
$("back").onclick=()=>history.state&&history.state.c?history.back():closeChat();
addEventListener("popstate",closeChat);

const fmt=d=>d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
function renderMsgs(docs,first){
  const box=$("msgs"),stick=first||box.scrollHeight-box.scrollTop-box.clientHeight<140;
  box.textContent="";let day="";
  for(const d of docs){
    const m=d.data({serverTimestamps:"estimate"}),t=m.createdAt?m.createdAt.toDate():new Date();
    const ds=t.toLocaleDateString("ru-RU",{day:"numeric",month:"long"});
    if(ds!==day){day=ds;const x=document.createElement("div");x.className="day";x.textContent=ds;box.append(x)}
    const mine=m.from===me.uid,row=document.createElement("div");row.className="row "+(mine?"me":"ot");
    const u=users.get(m.from)||{uid:m.from,name:"Пользователь"};
    if(!mine&&cur==="global")row.append(avatar(u,"sm"));
    const b=document.createElement("div");b.className="b";
    if(!mine&&cur==="global"){const n=document.createElement("span");n.className="n";n.textContent=u.name;b.append(n)}
    const tx=document.createElement("span");tx.textContent=m.text;     // только textContent — защита от XSS
    const tm=document.createElement("time");tm.textContent=fmt(t);
    b.append(tx,tm);row.append(b);box.append(row);
  }
  if(stick)box.scrollTop=box.scrollHeight;
}
const mt=$("mt");
mt.oninput=()=>{mt.style.height="auto";mt.style.height=Math.min(mt.scrollHeight,120)+"px"};
mt.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey&&innerWidth>780){e.preventDefault();$("mf").requestSubmit()}};
$("mf").onsubmit=async e=>{
  e.preventDefault();const text=mt.value.trim();if(!text||!cur)return;
  mt.value="";mt.style.height="auto";
  try{await addDoc(collection(db,"chats",cur,"messages"),{text,from:me.uid,createdAt:serverTimestamp()})}
  catch(x){mt.value=text;toast(errText(x))}
};
</script>
</body>
